tion" data-action="add-bar" role="button" tabindex="0" aria-label="Add bar"><rect x="247" y="552" width="116" height="38" rx="7" fill="#FFFFFF" stroke="#CDD7D0" /><g transform="translate(260 562) scale(0.75)" fill="none" stroke="currentColor" color="#21332F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5 V19 M5 12 H19"/></g><text x="287" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#21332F" font-weight="600" >Add bar</text></g><text x="1376" y="577" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#62726C" font-weight="500" text-anchor="end">D Dorian:  D  E  F  G  A  B  C</text><line x1="64" y1="628" x2="1376" y2="628" stroke="#E1E7E3" stroke-width="1" /><text x="64" y="674" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#21332F" font-weight="650" >Bring in your melody</text><text x="64" y="704" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#62726C" font-weight="400" >One voice, no backing track. You can fix the detected notes in the next step.</text><g id="capture-record" class="action" data-action="record" role="button" tabindex="0" aria-label="Record a melody"><rect x="64" y="729" width="644" height="119" rx="9" fill="#FFFFFF" stroke="#CAD6CD" /><circle cx="111" cy="775" r="24" fill="#E6F0EA" stroke="none"/><g transform="translate(100 763) scale(0.9166666666666666)" fill="none" stroke="currentColor" color="#226A53" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11 V12 A7 7 0 0 0 19 12 V11 M12 19 V23 M8 23 H16"/></g><text x="151" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#21332F" font-weight="650" >Record a melody</text><text x="151" y="796" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#62726C" font-weight="400" >Count-in + click at your tempo. Headphones recommended.</text><g transform="translate(663 769) scale(0.875)" fill="none" stroke="currentColor" color="#226A53" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19 M14 7 L19 12 L14 17"/></g></g><g id="capture-upload" class="action" data-action="upload" role="button" tabindex="0" aria-label="Upload a clean take"><rect x="732" y="729" width="644" height="119" rx="9" fill="#FFFFFF" stroke="#CAD6CD" /><circle cx="780" cy="775" r="24" fill="#F3F6F4" stroke="none"/><g transform="translate(769 763) scale(0.9166666666666666)" fill="none" stroke="currentColor" color="#62726C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16 V3 M7 8 L12 3 L17 8 M4 16 V21 H20 V16"/></g><text x="820" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#21332F" font-weight="650" >Upload a clean take</text><text x="820" y="796" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#62726C" font-weight="400" >Choose an audio file. Match your recording to the tempo.</text><g transform="translate(1332 769) scale(0.875)" fill="none" stroke="currentColor" color="#62726C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19 M14 7 L19 12 L14 17"/></g></g><g transform="translate(64 884) scale(0.75)" fill="none" stroke="currentColor" color="#226A53" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 L10 17 L19 7"/></g><text x="91" y="898" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#62726C" font-weight="400" >Tempo and chord timing are ready. Your melody comes next.</text><g id="button-review-1142-876" class="action" data-action="review" role="button" tabindex="0" aria-label="Continue to melody"><rect x="1142" y="876" width="234" height="42" rx="7" fill="#226A53" stroke="#226A53" /><g transform="translate(1155 888) scale(0.75)" fill="none" stroke="currentColor" color="#FFFFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12 H19 M14 7 L19 12 L14 17"/></g><text x="1182" y="902" 