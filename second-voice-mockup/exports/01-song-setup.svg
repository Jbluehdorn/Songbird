tempo" role="button" tabindex="0" aria-label="Change Tempo"><text x="432" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#62726C" font-weight="600" >Tempo</text><rect x="432" y="243" width="160" height="46" rx="7" fill="#FFFFFF" stroke="#CBD6CE" /><text x="447" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#21332F" font-weight="600" >96 BPM</text><g transform="translate(561 257) scale(0.75)" fill="none" stroke="currentColor" color="#62726C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10 L12 15 L17 10"/></g></g><g id="field-Timesignature-616" class="action" data-action="meter" role="button" tabindex="0" aria-label="Change Time signature"><text x="616" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#62726C" font-weight="600" >Time signature</text><rect x="616" y="243" width="152" height="46" rx="7" fill="#FFFFFF" stroke="#CBD6CE" /><text x="631" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#21332F" font-weight="600" >4/4</text><g transform="translate(737 257) scale(0.75)" fill="none" stroke="currentColor" color="#62726C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10 L12 15 L17 10"/></g></g><g id="field-Tonalcenter-792" class="action" data-action="tonic" role="button" tabindex="0" aria-label="Change Tonal center"><text x="792" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#62726C" font-weight="600" >Tonal center</text><rect x="792" y="243" width="152" height="46" rx="7" fill="#FFFFFF" stroke="#CBD6CE" /><text x="807" y="273" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#21332F" font-weight="600" >D</text><g transform="translate(913 257) scale(0.75)" fill="none" stroke="currentColor" color="#62726C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10 L12 15 L17 10"/></g></g><g id="field-Scalemode-968" class="action" data-action="scale